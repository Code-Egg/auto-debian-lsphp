name: Auto-trigger ARM64 build on version bump

on:
  push:
    branches:
      - php81
    paths:
      - VERSION.txt

jobs:
  detect-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # ensure previous commit available

      - name: Detect changed versions
        id: detect
        run: |
          echo "Reading VERSION.txt..."
          OLD_CONTENT=$(git show ${{ github.event.before }}:VERSION.txt 2>/dev/null || true)
          NEW_CONTENT=$(cat VERSION.txt)

          echo "$OLD_CONTENT" > old.txt
          echo "$NEW_CONTENT" > new.txt

          # Get added/changed lines
          DIFF=$(diff -U0 old.txt new.txt | grep -E "^[+-]" | grep -vE "^(---|\+\+\+)")
          if [ -z "$DIFF" ]; then
            echo "No version changes detected."
            exit 0
          fi

          NEW_LINES=$(echo "$DIFF" | grep '^+' | cut -c2-)
          echo "NEW_LINES:"
          echo "$NEW_LINES"

          CHANGED_PKGS=()
          while IFS= read -r line; do
            NAME=${line%%=*}
            VER=${line#*=}

            # Optional: skip downgrades
            OLD_VER=$(echo "$OLD_CONTENT" | grep "^$NAME=" | cut -d'=' -f2 || echo "")
            if [[ "$OLD_VER" != "" ]] && dpkg --compare-versions "$VER" lt "$OLD_VER"; then
              echo "Skipping downgrade for $NAME ($OLD_VER -> $VER)"
              continue
            fi

            CHANGED_PKGS+=("$NAME=$VER")
          done <<< "$NEW_LINES"

          if [ ${#CHANGED_PKGS[@]} -eq 0 ]; then
            echo "No valid version upgrades detected."
            exit 0
          fi

          echo "CHANGED_PKGS=${CHANGED_PKGS[*]}" >> $GITHUB_ENV
          echo "Detected package updates: ${CHANGED_PKGS[*]}"

      - name: Trigger build for first changed package only
        if: env.CHANGED_PKGS != ''
        run: |
          FIRST_PKG_VER=$(echo "${{ env.CHANGED_PKGS }}" | awk '{print $1}')
          PKG=$(echo "$FIRST_PKG_VER" | cut -d'=' -f1)
          VER=$(echo "$FIRST_PKG_VER" | cut -d'=' -f2)
          echo "Triggering build for first changed package: $PKG version $VER"
          gh workflow run self-host-arm64-build.yml \
            --ref main \
            -f package="\"$PKG\"" \
            -f distro="\"bookworm\"" || echo "Failed to trigger $PKG"